<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flight Finder (Amadeus)</title>
  <style>
    :root{
      --teal:#0f6b79;
      --bg:#f4f6f8;
      --card:#ffffff;
      --muted:#6b7280;
      --border:#e5e7eb;
      --shadow:0 6px 18px rgba(0,0,0,.06);
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#111827}
    header{
      background:var(--teal);
      color:#fff;
      padding:14px 18px;
      position:sticky; top:0; z-index:10;
      box-shadow:0 2px 10px rgba(0,0,0,.12);
    }
    .topbar{
      display:flex; gap:12px; align-items:center; justify-content:space-between;
      max-width:1100px; margin:0 auto;
    }
    .brand{
      display:flex; gap:12px; align-items:center; min-width:240px;
    }
    .brand .dot{
      width:28px; height:28px; border-radius:999px; background:rgba(255,255,255,.18);
      display:grid; place-items:center; font-weight:700;
    }
    .route{
      display:flex; flex-direction:column; line-height:1.1;
    }
    .route b{font-size:16px}
    .route small{opacity:.9}
    .inputs{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      justify-content:flex-end;
    }
    .inputs label{
      display:flex; gap:6px; align-items:center;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.22);
      padding:6px 10px;
      border-radius:999px;
    }
    .inputs span{font-size:12px; opacity:.95}
    .inputs input{
      width:78px;
      background:transparent;
      border:0;
      color:#fff;
      outline:none;
      font-weight:700;
      text-transform:uppercase;
    }
    .inputs input[type="date"]{
      width:140px;
      text-transform:none;
      font-weight:600;
    }
    .btn{
      background:#fff;
      color:#0f172a;
      border:0;
      padding:10px 16px;
      border-radius:999px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 6px 14px rgba(0,0,0,.12);
    }
    .btn:active{transform:translateY(1px)}
    main{max-width:1100px;margin:18px auto;padding:0 18px}
    .grid{
      display:grid;
      grid-template-columns:280px 1fr;
      gap:18px;
      align-items:start;
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
    }
    .card h3{margin:0 0 12px 0;font-size:14px;color:#111827}
    .muted{color:var(--muted);font-size:12px}
    .pill{
      display:inline-flex;gap:8px;align-items:center;
      padding:10px 12px;border:1px solid var(--border);
      border-radius:999px;background:#f9fafb;font-weight:700;cursor:pointer;
    }
    .radioRow{display:flex;flex-direction:column;gap:8px;margin:10px 0 16px}
    .radioRow label{display:flex;gap:10px;align-items:center;font-size:13px;color:#111827;cursor:pointer}
    .radioRow input{accent-color:var(--teal)}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .row select, .row input[type="range"]{
      width:100%;
    }
    select{
      border:1px solid var(--border);
      border-radius:10px;
      padding:10px 12px;
      background:#fff;
      font-weight:600;
    }
    .resultsHeader{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      margin-bottom:10px;
    }
    .resultsHeader .title{font-weight:800}
    a.link{color:var(--teal); text-decoration:none; font-weight:700; font-size:12px}
    a.link:hover{text-decoration:underline}
    .notice{
      border:1px dashed #cbd5e1;
      border-radius:12px;
      padding:12px;
      background:#f8fafc;
      font-size:13px;
    }
    .error{
      border:1px solid #fecaca;
      background:#fff1f2;
      color:#991b1b;
      border-radius:12px;
      padding:10px 12px;
      font-size:13px;
      white-space:pre-wrap;
    }
    .list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
    .item{
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      background:#fff;
    }
    .item b{font-size:14px}
    .item small{display:block;color:var(--muted);margin-top:4px}
    .price{
      font-weight:900;
      font-size:16px;
      white-space:nowrap;
    }
    .tag{
      display:inline-block;
      font-size:11px;
      padding:3px 8px;
      border-radius:999px;
      border:1px solid var(--border);
      color:#0f172a;
      background:#f9fafb;
      margin-top:6px;
      margin-right:6px;
    }
    footer{
      max-width:1100px;
      margin:18px auto 32px;
      padding:0 18px;
      color:var(--muted);
      font-size:12px;
    }
    @media (max-width: 900px){
      .grid{grid-template-columns:1fr}
      .brand{min-width:auto}
      .inputs{justify-content:flex-start}
    }
  </style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">
      <div class="dot">✈︎</div>
      <div class="route">
        <b id="routeLabel">DEL → LON</b>
        <small id="routeMeta">1 adult · Economy</small>
      </div>
    </div>

    <div class="inputs" role="form" aria-label="Search inputs">
      <label title="IATA code">
        <span>From</span>
        <input id="from" maxlength="3" value="DEL" />
      </label>
      <label title="IATA code">
        <span>To</span>
        <input id="to" maxlength="3" value="LON" />
      </label>
      <label>
        <span>Date</span>
        <input id="date" type="date" />
      </label>
      <button class="btn" id="runSearch">Search</button>
    </div>
  </div>
</header>

<main>
  <div class="grid">
    <section class="card">
      <button class="pill" type="button" id="priceAlert">🔔 Get Price Alerts</button>

      <h3 style="margin-top:14px">Stops</h3>
      <div class="radioRow" id="stops">
        <label><input type="radio" name="stops" value="" checked> Any</label>
        <label><input type="radio" name="stops" value="0"> Direct</label>
        <label><input type="radio" name="stops" value="1"> 1 stop max</label>
        <label><input type="radio" name="stops" value="2"> 2+ stops</label>
      </div>

      <h3>Journey duration</h3>
      <div class="row" style="gap:12px">
        <div class="muted" style="min-width:70px" id="durLabel">0h – 70h</div>
        <input id="dur" type="range" min="1" max="70" step="1" value="70" />
      </div>

      <h3 style="margin-top:16px">Sort by</h3>
      <select id="sort">
        <option value="cheapest" selected>Cheapest first</option>
        <option value="best">Best</option>
        <option value="fastest">Fastest</option>
      </select>

      <div class="muted" style="margin-top:12px">Additional bag fees may apply</div>
    </section>

    <section class="card">
      <div class="resultsHeader">
        <div class="title" id="summary">—</div>
        <a class="link" href="#" id="showMonth">Show whole month</a>
      </div>

      <div id="state" class="notice">Loading…</div>
      <div id="error" class="error" style="display:none"></div>
      <div class="list" id="list"></div>
    </section>
  </div>
</main>

<footer>
  Build: <span id="buildId"></span>
</footer>

<script>
(function(){
  const $ = (id) => document.getElementById(id);

  const els = {
    from: $("from"),
    to: $("to"),
    date: $("date"),
    run: $("runSearch"),
    routeLabel: $("routeLabel"),
    routeMeta: $("routeMeta"),
    summary: $("summary"),
    state: $("state"),
    error: $("error"),
    list: $("list"),
    dur: $("dur"),
    durLabel: $("durLabel"),
    sort: $("sort"),
    showMonth: $("showMonth"),
    priceAlert: $("priceAlert")
  };

  const BUILD = new Date().toISOString();
  $("buildId").textContent = BUILD;

  function fmtLocal(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  // Default date: +14 days to avoid timezone edge cases
  const d = new Date();
  d.setDate(d.getDate() + 14);
  els.date.value = fmtLocal(d);

  function iata(v){ return String(v||"").trim().toUpperCase(); }

  function getStops(){
    const checked = document.querySelector('input[name="stops"]:checked');
    return checked ? checked.value : "";
  }

  function setHeader(){
    const f = iata(els.from.value) || "—";
    const t = iata(els.to.value) || "—";
    els.routeLabel.textContent = `${f} → ${t}`;
    els.routeMeta.textContent = `1 adult · Economy`;
  }
  setHeader();

  function clearUI(){
    els.error.style.display = "none";
    els.error.textContent = "";
    els.list.innerHTML = "";
  }

  function showState(msg){
    els.state.className = "notice";
    els.state.textContent = msg;
    els.state.style.display = "block";
  }

  function showError(msg){
    els.error.style.display = "block";
    els.error.textContent = msg;
  }

  function minutesToHM(min){
    if (!Number.isFinite(min)) return "—";
    const h = Math.floor(min/60);
    const m = Math.round(min%60);
    return `${h}h ${String(m).padStart(2,"0")}m`;
  }

  function scoreOf(it, mode){
    // mode: cheapest | fastest | best
    if (mode === "cheapest") return it.total || Infinity;
    if (mode === "fastest") return it.durationMinutes || Infinity;
    // best: simple blend
    return (it.total || 0) * 0.6 + (it.durationMinutes || 0) * 0.4;
  }

  function renderList(items){
    window.__lastOffers = items || [];
    els.list.innerHTML = "";
    if (!items || items.length === 0){
      showState("No results for current filters.");
      return;
    }
    els.state.style.display = "none";

    const maxDur = Number(els.dur.value || 70) * 60;
    const stopsVal = getStops();
    const maxStops = stopsVal === "" ? null : Number(stopsVal);

    let filtered = items.filter(it => {
      if (Number.isFinite(it.durationMinutes) && it.durationMinutes > maxDur) return false;
      if (maxStops !== null && Number.isFinite(it.stops) && it.stops > maxStops) return false;
      return true;
    });

    const sortMode = els.sort.value;
    filtered.sort((a,b)=> scoreOf(a, sortMode) - scoreOf(b, sortMode));

    els.summary.textContent = `${filtered.length} results · sorted by ${sortMode === "cheapest" ? "Cheapest" : (sortMode === "fastest" ? "Fastest" : "Best")}`;

    for (const it of filtered){
      const div = document.createElement("div");
      div.className = "item";

      const left = document.createElement("div");
      left.style.flex = "1";

      const title = document.createElement("b");
      title.textContent = `${it.carrier || "Airline"} · ${it.origin} → ${it.destination}`;
      left.appendChild(title);

      const sub = document.createElement("small");
      sub.textContent = `${it.departTime || "—"} → ${it.arriveTime || "—"} · ${minutesToHM(it.durationMinutes)} · ${it.stops} stop${it.stops===1?"":"s"}`;
      left.appendChild(sub);

      const tags = document.createElement("div");
      const tag1 = document.createElement("span");
      tag1.className = "tag";
      tag1.textContent = it.travelClass || "ECONOMY";
      tags.appendChild(tag1);

      if (it.validatingAirlineCodes && it.validatingAirlineCodes.length){
        const tag2 = document.createElement("span");
        tag2.className = "tag";
        tag2.textContent = `VA: ${it.validatingAirlineCodes.join(",")}`;
        tags.appendChild(tag2);
      }
      left.appendChild(tags);

      const right = document.createElement("div");
      right.style.textAlign = "right";

      const price = document.createElement("div");
      price.className = "price";
      price.textContent = `${it.currency || ""} ${Number.isFinite(it.total) ? it.total.toFixed(2) : (it.total ?? "—")}`;
      right.appendChild(price);

      const btn = document.createElement("button");
      btn.className = "btn";
      btn.style.marginTop = "8px";
      btn.textContent = "Select";
      btn.addEventListener("click", ()=> {
        alert(`Selected offer:\n${it.origin} → ${it.destination}\n${it.currency||""} ${it.total}\n\n(Phase 2: Price + checkout)`);
      });
      right.appendChild(btn);

      div.appendChild(left);
      div.appendChild(right);
      els.list.appendChild(div);
    }
  }

  async function search(){
    clearUI();
    setHeader();

    const origin = iata(els.from.value);
    const destination = iata(els.to.value);
    const departDate = String(els.date.value || "").trim();

    if (!/^[A-Z]{3}$/.test(origin) || !/^[A-Z]{3}$/.test(destination)){
      showState("Waiting for valid inputs…");
      showError("Origin/Destination must be 3-letter IATA codes (e.g., DEL, LON, JFK).");
      return;
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(departDate)){
      showState("Waiting for valid inputs…");
      showError("Please choose a valid date (YYYY-MM-DD).");
      return;
    }

    showState("Searching…");

    try{
      const res = await fetch("/api/flights/search", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          origin,
          destination,
          departDate,
          adults: 1,
          travelClass: "ECONOMY",
          maxStops: getStops()==="" ? null : Number(getStops())
        })
      });

      const text = await res.text();
      let data;
      try{ data = JSON.parse(text); } catch { data = { raw: text }; }

      if (!res.ok){
        showState("No results for current filters.");
        showError(typeof data === "string" ? data : JSON.stringify(data, null, 2));
        return;
      }

      const offers = Array.isArray(data) ? data : (data.offers || data.data || data.results || []);
      renderList(offers);
    }catch(err){
      showState("No results for current filters.");
      showError(String(err && err.message ? err.message : err));
    }
  }

  // UI events
  els.run.addEventListener("click", search);
  els.from.addEventListener("input", setHeader);
  els.to.addEventListener("input", setHeader);
  els.dur.addEventListener("input", ()=> {
    els.durLabel.textContent = `0h – ${els.dur.value}h`;
    if (window.__lastOffers) renderList(window.__lastOffers);
  });
  els.sort.addEventListener("change", ()=> {
    if (window.__lastOffers) renderList(window.__lastOffers);
  });
  document.getElementById("stops").addEventListener("change", ()=> {
    if (window.__lastOffers) renderList(window.__lastOffers);
  });
  els.showMonth.addEventListener("click", (e)=> {
    e.preventDefault();
    alert("Phase 2: Month view (calendar + price graph).");
  });
  els.priceAlert.addEventListener("click", ()=> {
    alert("Phase 2: Price alerts (email / push).");
  });

  // Auto-run once on load
  showState("Ready. Auto-searching…");
  search();
})();
</script>
</body>
</html>
