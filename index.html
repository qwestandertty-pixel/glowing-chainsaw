<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flights · Price Search</title>
  <style>
    :root{--teal:#0d7783;--bg:#f4f6f8;--card:#fff;--muted:#6b7785;--border:#e6eaee;--shadow:0 10px 30px rgba(0,0,0,.06)}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background:var(--bg); color:#14212b}
    header{background:var(--teal); color:#fff; padding:14px 18px; position:sticky; top:0; z-index:10}
    .topbar{display:flex; align-items:center; gap:14px; max-width:1060px; margin:0 auto}
    .logo{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center; font-weight:700}
    .routeWrap{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0}
    .routeLine{display:flex; align-items:center; gap:10px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .subLine{font-size:12px; opacity:.9}
    .pill{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:6px 10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
    .pill input{width:74px; padding:6px 8px; border-radius:10px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.12); color:#fff; outline:none}
    .pill input::placeholder{color:rgba(255,255,255,.7)}
    .pill input[type="date"]{width:140px}
    .hint{font-size:11px; opacity:.85}
    .searchBtn{margin-left:auto; background:#fff; color:var(--teal); border:none; padding:9px 14px; border-radius:999px; font-weight:700; cursor:pointer}
    .container{max-width:1060px; margin:18px auto; padding:0 14px}
    .layout{display:grid; grid-template-columns:280px 1fr; gap:16px}
    .card{background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow)}
    .side{padding:16px}
    .side h3{margin:6px 0 10px; font-size:15px}
    .btnGhost{display:block; width:100%; border:1px solid var(--border); background:#f7f9fb; padding:12px 12px; border-radius:14px; cursor:pointer; font-weight:700}
    .section{margin-top:16px}
    .radio{display:flex; flex-direction:column; gap:10px; font-size:14px}
    .radio label{display:flex; align-items:center; gap:10px}
    .sliderRow{margin-top:10px}
    .sliderRow input{width:100%}
    .main{padding:16px}
    .mainTop{display:flex; align-items:center; justify-content:space-between; gap:12px}
    .mainTop .meta{color:var(--muted); font-size:13px}
    .sortSel{border:1px solid var(--border); background:#fff; padding:10px 12px; border-radius:12px}
    .tabs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:12px 0 10px}
    .tab{border:1px solid var(--border); border-radius:16px; padding:12px 12px; text-align:center; background:#fff}
    .tab .label{font-size:12px; color:var(--muted)}
    .tab .price{font-size:18px; font-weight:800; margin-top:4px}
    .tab.active{border-color:rgba(13,119,131,.45); box-shadow:0 0 0 3px rgba(13,119,131,.12)}
    .list{display:flex; flex-direction:column; gap:12px; margin-top:10px}
    .offer{display:grid; grid-template-columns:1fr 160px; gap:12px; padding:14px; border:1px solid var(--border); border-radius:18px; background:#fff}
    .offer .airline{font-weight:800; font-size:14px; margin-bottom:6px}
    .offer .row{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap}
    .timeBox{min-width:190px}
    .time{font-size:22px; font-weight:900}
    .iata{font-weight:800; font-size:12px; color:var(--muted)}
    .mid{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px}
    .mid .line{flex:1; height:2px; background:#d9e3e8; border-radius:99px; position:relative}
    .mid .dot{width:8px;height:8px;border-radius:50%; background:#d94f4f}
    .stopBadge{background:#fff7f7; border:1px solid #ffd2d2; color:#b91c1c; padding:3px 8px; border-radius:999px; font-weight:800}
    .priceCol{display:flex; flex-direction:column; align-items:flex-end; justify-content:center}
    .deal{color:var(--muted); font-size:12px}
    .priceBig{font-size:26px; font-weight:950; margin:6px 0}
    .selectBtn{background:#19a64a; color:#fff; border:none; padding:10px 14px; border-radius:999px; font-weight:900; cursor:pointer}
    .errorBox{margin-top:10px; padding:12px 12px; border-radius:14px; border:1px solid #f2c1c1; background:#fff3f3; color:#8a1f1f; font-size:13px; white-space:pre-wrap}
    .emptyBox{margin-top:12px; padding:14px; border-radius:16px; border:1px dashed var(--border); color:var(--muted)}
    .footNote{color:var(--muted); font-size:12px; margin-top:12px}
    @media (max-width: 920px){.layout{grid-template-columns:1fr}.offer{grid-template-columns:1fr}.priceCol{align-items:flex-start}}
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="logo">✈︎</div>
      <div class="routeWrap">
        <div class="routeLine">
          <div class="pill" title="Use IATA codes (e.g., MEL, SYD, LAX, JFK)">
            <input id="origin" placeholder="DEL" maxlength="3" />
            <span style="opacity:.9">→</span>
            <input id="destination" placeholder="LON" maxlength="3" />
            <input id="departDate" type="date" />
            <input id="returnDate" type="date" />
          </div>
        </div>
        <div class="subLine"><span id="paxLine">1 adult · Economy</span> <span class="hint" id="dateHint"></span></div>
      </div>
      <button class="searchBtn" id="runSearch">Search</button>
    </div>
  </header>

  <div class="container">
    <div class="layout">
      <aside class="card side">
        <button class="btnGhost" id="priceAlert">🔔 Get Price Alerts</button>

        <div class="section">
          <h3>Stops</h3>
          <div class="radio">
            <label><input type="radio" name="stops" value="any" checked> Any</label>
            <label><input type="radio" name="stops" value="0"> Direct</label>
            <label><input type="radio" name="stops" value="1"> 1 stop max</label>
            <label><input type="radio" name="stops" value="2"> 2+ stops</label>
          </div>
        </div>

        <div class="section">
          <h3>Journey duration</h3>
          <div class="sliderRow">
            <div style="display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-bottom:6px">
              <span id="durLabel">0h – 70h</span>
              <span id="durValue">70h</span>
            </div>
            <input id="dur" type="range" min="1" max="70" value="70" />
          </div>
        </div>

        <div class="section">
          <h3>Sort by</h3>
          <select id="sort" class="sortSel" style="width:100%">
            <option value="CHEAPEST">Cheapest first</option>
            <option value="BEST">Best</option>
            <option value="FASTEST">Fastest</option>
          </select>
        </div>

        <div class="footNote">Additional bag fees may apply</div>
      </aside>

      <main class="card main">
        <div class="mainTop">
          <div class="meta"><span id="count">0</span> results · sorted by <b id="sortedBy">Cheapest</b></div>
          <a href="#" id="wholeMonth" style="color:var(--muted); font-size:12px; text-decoration:none">Show whole month</a>
        </div>

        <div id="tabs" class="tabs"></div>

        <div id="error" class="errorBox" style="display:none"></div>
        <div id="list" class="list"></div>
        <div id="empty" class="emptyBox" style="display:none">No results for current filters.</div>
      </main>
    </div>
  </div>

<script>
  // --- Helpers ---
  function pad2(n){return String(n).padStart(2,'0');}
  function toYMD(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
  function addDays(d, days){const x=new Date(d); x.setDate(x.getDate()+days); return x;}
  function todayLocal(){const t=new Date(); t.setHours(0,0,0,0); return t;}
  function fmtShort(d){return d.toLocaleDateString(undefined,{weekday:'short', day:'2-digit', month:'short'});}
  function clampIata(v){return (v||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,3);}

  // --- State (defaults are always in the future) ---
  const t0 = todayLocal();
  const DEFAULT_DEPART = addDays(t0, 7);
  const DEFAULT_RETURN = addDays(t0, 21);

  const state = {
    origin: "DEL",
    destination: "LON",
    departDate: toYMD(DEFAULT_DEPART),
    returnDate: toYMD(DEFAULT_RETURN),
    adults: 1,
    travelClass: "ECONOMY",
    maxStops: null,
    maxDurationHours: 70,
    sort: "CHEAPEST",
    offers: [],
    best: null,
    cheapest: null,
    fastest: null,
    lastError: "",
  };

  // URL params override (optional)
  (function hydrateFromUrl(){
    const p = new URLSearchParams(location.search);
    const o = p.get('o'); const d = p.get('d');
    const dep = p.get('depart'); const ret = p.get('return');
    if (o) state.origin = clampIata(o);
    if (d) state.destination = clampIata(d);
    if (dep) state.departDate = dep;
    if (ret) state.returnDate = ret;
  })();

  // --- Elements ---
  const $ = (id)=>document.getElementById(id);
  const elOrigin = $('origin');
  const elDest = $('destination');
  const elDepart = $('departDate');
  const elReturn = $('returnDate');

  function syncInputs(){
    elOrigin.value = state.origin;
    elDest.value = state.destination;
    elDepart.value = state.departDate;
    elReturn.value = state.returnDate;
    $('paxLine').textContent = `${state.adults} adult${state.adults>1?'s':''} · ${state.travelClass[0]}${state.travelClass.slice(1).toLowerCase()}`;
    const depD = new Date(state.departDate+"T00:00:00");
    const retD = new Date(state.returnDate+"T00:00:00");
    $('dateHint').textContent = `· ${fmtShort(depD)} → ${fmtShort(retD)}`;
    $('sortedBy').textContent = state.sort === 'CHEAPEST' ? 'Cheapest' : (state.sort === 'BEST' ? 'Best' : 'Fastest');
    $('durValue').textContent = state.maxDurationHours + 'h';
  }

  // --- Rendering ---
  function money(n,c){
    const num = Number(n||0);
    try {return new Intl.NumberFormat(undefined,{style:'currency',currency:c||'USD',maximumFractionDigits:0}).format(num);}catch(e){return (c||'USD')+' '+Math.round(num);} 
  }
  function minutesToHM(m){
    m=Math.max(0,Math.round(m||0));
    const h=Math.floor(m/60), mm=m%60;
    return `${h}h ${mm}m`;
  }

  function renderTabs(){
    const t = $('tabs');
    const mk = (key,label,offer,active)=>{
      const price = offer? money(offer.price.total, offer.price.currency) : '—';
      const dur = offer? minutesToHM(offer.metrics.totalMinutes) : '';
      return `<div class="tab ${active?'active':''}" data-tab="${key}">
        <div class="label">${label}</div>
        <div class="price">${price}</div>
        <div class="label">${dur}${offer? ' (average)' : ''}</div>
      </div>`;
    };
    t.innerHTML = [
      mk('BEST','Best',state.best,state.sort==='BEST'),
      mk('CHEAPEST','Cheapest',state.cheapest,state.sort==='CHEAPEST'),
      mk('FASTEST','Fastest',state.fastest,state.sort==='FASTEST'),
    ].join('');
  }

  function renderList(){
    const list = $('list');
    list.innerHTML = '';
    state.offers.forEach((o)=>{
      const firstItin = o.itineraries[0];
      const firstSeg = firstItin?.segments?.[0];
      const lastSeg = firstItin?.segments?.[firstItin.segments.length-1];
      const depTime = firstSeg?.departure?.at ? new Date(firstSeg.departure.at) : null;
      const arrTime = lastSeg?.arrival?.at ? new Date(lastSeg.arrival.at) : null;

      const stopTxt = o.metrics.totalStops===0 ? 'Direct' : `${o.metrics.totalStops} stop${o.metrics.totalStops>1?'s':''}`;
      const stopIata = (o.metrics.stopIatas && o.metrics.stopIatas.length) ? o.metrics.stopIatas[0] : '';

      list.insertAdjacentHTML('beforeend', `
        <div class="offer">
          <div>
            <div class="airline">${(o.carriers||['Airline'])[0]}</div>
            <div class="row">
              <div class="timeBox">
                <div class="time">${depTime? depTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '—'}</div>
                <div class="iata">${firstSeg?.departure?.iataCode || '—'}</div>
              </div>
              <div style="min-width:240px; flex:1">
                <div class="mid">
                  <span>${minutesToHM(o.metrics.totalMinutes)}</span>
                  <div class="line"><span class="dot" style="position:absolute; left:50%; top:-3px"></span></div>
                  <span class="stopBadge">${stopTxt}${stopIata? ' '+stopIata:''}</span>
                </div>
              </div>
              <div class="timeBox">
                <div class="time">${arrTime? arrTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '—'}</div>
                <div class="iata">${lastSeg?.arrival?.iataCode || '—'}</div>
              </div>
            </div>
          </div>
          <div class="priceCol">
            <div class="deal">${(o.meta.dealsCount||5)} deals from</div>
            <div class="priceBig">${money(o.price.total, o.price.currency)}</div>
            <button class="selectBtn" data-select="${o.id}">Select →</button>
          </div>
        </div>
      `);
    });
  }

  function applyFilters(){
    const maxDurMin = state.maxDurationHours*60;
    let rows = (state._rawOffers||state.offers||[]).slice();

    // Stops
    if (state.maxStops !== null) {
      if (state.maxStops === 2) rows = rows.filter(o => o.metrics.totalStops >= 2);
      else rows = rows.filter(o => o.metrics.totalStops <= state.maxStops);
    }

    // Duration
    rows = rows.filter(o => o.metrics.totalMinutes <= maxDurMin);

    // Sort
    const sortKey = state.sort;
    if (sortKey === 'CHEAPEST') rows.sort((a,b)=>a.price.total-b.price.total);
    if (sortKey === 'FASTEST') rows.sort((a,b)=>a.metrics.totalMinutes-b.metrics.totalMinutes);
    if (sortKey === 'BEST') rows.sort((a,b)=> (a.price.total*0.7 + a.metrics.totalMinutes*0.3) - (b.price.total*0.7 + b.metrics.totalMinutes*0.3));

    state.offers = rows;
  }

  function computeTop(){
    const all = (state._rawOffers||state.offers||[]).slice();
    if (!all.length){ state.best=null; state.cheapest=null; state.fastest=null; return; }
    const cheapest = all.slice().sort((a,b)=>a.price.total-b.price.total)[0];
    const fastest = all.slice().sort((a,b)=>a.metrics.totalMinutes-b.metrics.totalMinutes)[0];
    const best = all.slice().sort((a,b)=> (a.price.total*0.7 + a.metrics.totalMinutes*0.3) - (b.price.total*0.7 + b.metrics.totalMinutes*0.3))[0];
    state.cheapest = cheapest; state.fastest = fastest; state.best = best;
  }

  function render(){
    syncInputs();
    renderTabs();
    $('count').textContent = String(state.offers.length);
    $('error').style.display = state.lastError ? 'block' : 'none';
    $('error').textContent = state.lastError || '';
    renderList();
    $('empty').style.display = (!state.lastError && state.offers.length===0) ? 'block' : 'none';
  }

  // --- Search ---
  function validateAndFixDates(){
    const t = todayLocal();
    let dep = new Date(state.departDate+"T00:00:00");
    let ret = new Date(state.returnDate+"T00:00:00");

    // If depart is today/past -> tomorrow
    if (!(dep instanceof Date) || isNaN(dep.getTime()) || dep <= t) {
      dep = addDays(t, 1);
      state.departDate = toYMD(dep);
    }
    // If return invalid or <= depart -> depart + 7
    if (!(ret instanceof Date) || isNaN(ret.getTime()) || ret <= dep) {
      ret = addDays(dep, 7);
      state.returnDate = toYMD(ret);
    }
  }

  async function searchFlights(){
    // Pull from inputs
    state.origin = clampIata(elOrigin.value);
    state.destination = clampIata(elDest.value);
    state.departDate = elDepart.value;
    state.returnDate = elReturn.value;

    validateAndFixDates();
    syncInputs();

    if (!state.origin || !state.destination || state.origin.length!==3 || state.destination.length!==3) {
      state.lastError = 'Please enter valid IATA airport codes (3 letters), e.g. MEL, SYD, LAX, JFK.';
      state._rawOffers = []; state.offers = [];
      render();
      return;
    }

    state.lastError = '';
    state._rawOffers = [];
    state.offers = [];
    render();

    try {
      const resp = await fetch('/api/flights/search', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          origin: state.origin,
          destination: state.destination,
          departDate: state.departDate,
          returnDate: state.returnDate,
          adults: state.adults,
          travelClass: state.travelClass,
          maxStops: state.maxStops,
        })
      });

      const json = await resp.json().catch(()=>({error:'Invalid JSON response'}));
      if (!resp.ok) {
        state.lastError = typeof json === 'string' ? json : (json.error ? (typeof json.error==='string'? json.error : JSON.stringify(json.error)) : JSON.stringify(json));
        state._rawOffers = []; state.offers = [];
        render();
        return;
      }

      const offers = (json && json.offers) ? json.offers : [];
      state._rawOffers = offers;
      computeTop();
      applyFilters();
      render();
    } catch (e) {
      state.lastError = String(e);
      render();
    }
  }

  // --- Wiring ---
  $('runSearch').addEventListener('click', ()=>searchFlights());
  $('priceAlert').addEventListener('click', ()=>alert('Price alerts (Phase 2)'));

  document.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-select]');
    if (!btn) return;
    alert('Selected offer: ' + btn.getAttribute('data-select') + "\n\n(Phase 2: flight offers price + checkout)");
  });

  $('sort').addEventListener('change', (e)=>{
    state.sort = e.target.value;
    applyFilters();
    render();
  });

  document.querySelectorAll('input[name="stops"]').forEach(r=>{
    r.addEventListener('change', ()=>{
      const v = document.querySelector('input[name="stops"]:checked')?.value;
      state.maxStops = (v==='any') ? null : Number(v);
      applyFilters();
      render();
    });
  });

  $('dur').addEventListener('input', (e)=>{
    state.maxDurationHours = Number(e.target.value);
    applyFilters();
    render();
  });

  elOrigin.addEventListener('blur', ()=>{elOrigin.value = clampIata(elOrigin.value);});
  elDest.addEventListener('blur', ()=>{elDest.value = clampIata(elDest.value);});

  // First paint
  syncInputs();
  renderTabs();
  render();

  // Auto-run once so page isn't empty.
  // Comment out if you prefer manual.
  searchFlights();
</script>
</body>
</html>
